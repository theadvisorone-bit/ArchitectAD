name: Build Android APK

on:
  push:
    branches: [ main ]  # Runs automatically when code is pushed to 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App & Sync to Android
        run: |
          npm install
          npx cap sync android  # Wraps HTML/JS into Android project

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archiPlan-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
