<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ArchiPlan - Pro BIM & CAD</title>
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Three.js for 3D BIM ArchiCAD/Revit style viewport -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- PDF.js for parsing blueprints -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
:root{--bg:#0b0b0c;--panel:#151618;--line:#2a2c30;--gold:#e0a526;--text:#f2f2f2;--mut:#9aa0a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header img{width:36px;height:36px;border-radius:9px}
.t{flex:1;min-width:0}
.t b{display:block;font-size:15px}
.t span{display:block;font-size:12px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;gap:6px;align-items:center}
select,label.file-btn{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:13px;cursor:pointer}
label.file-btn{display:inline-block;padding:7px 10px;font-weight:500}
label.file-btn input{display:none}
#wrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#view3D{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:2}
#st{padding:7px 12px;font-size:13px;color:var(--mut);background:var(--panel);border-top:1px solid var(--line);min-height:32px}
nav{display:flex;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);flex-wrap:wrap}
nav button{flex:1;min-width:60px;padding:10px 0;font-size:11px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;cursor:pointer}
nav button.on{border-color:var(--gold);color:var(--gold)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:99;transition:opacity .5s}
#splash img{width:140px;height:140px;border-radius:30px}
#splash b{font-size:24px}
#splash span{color:var(--gold);font-size:16px}
</style>
</head>
<body>
<div id="app">
<header>
  <img src="icon-192.png" alt="">
  <div class="t"><b>ArchiPlan Pro</b><span>Arch. Adamu Umar Sarki</span></div>
  <div class="header-actions">
    <label class="file-btn">Import PDF/CAD<input type="file" id="pdfUpload" accept=".pdf,image/*"></label>
    <select id="unit" aria-label="Units"></select>
  </div>
</header>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="view3D"></div>
</div>
<div id="st"></div>
<nav>
<button data-t="pan">Pan</button>
<button data-t="wall" class="on">Wall</button>
<button data-t="door">Door</button>
<button data-t="window">Window</button>
<button data-t="erase">Erase</button>
<button id="mode3D">3D BIM</button>
<button id="roofBtn">Auto Roof</button>
<button id="undo">Undo</button>
<button id="ortho" class="on">Ortho</button>
<button id="snap" class="on">Snap</button>
<button id="clear">Clear</button>
</nav>
</div>

<div id="splash">
  <img src="icon-512.png" alt="">
  <b>ArchiPlan Pro</b>
  <span>Arch. Adamu Umar Sarki</span>
</div>

<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const UNITS={mm:{l:'mm',f:1,s:100},cm:{l:'cm',f:10,s:100},m:{l:'m',f:1000,s:500},in:{l:'in',f:25.4,s:152.4},ft:{l:'ft',f:304.8,s:304.8},ftin:{l:'ft/in',f:304.8,s:304.8}};
const T=230; // Wall thickness mm
let S={walls:[],doors:[],windows:[],unit:'m',bgImage:null},view={x:20,y:40,k:0.05},tool='wall',ortho=true,snap=true,undo=[],dpr=1,drag=null,is3D=false;
let scene,camera,renderer,renderLoopId;
const ptrs=new Map();

try{const d=JSON.parse(localStorage.getItem('archiplan_pro'));if(d&&d.walls){S=d;if(!UNITS[S.unit])S.unit='m';}}catch(e){}
const save=()=>{try{localStorage.setItem('archiplan_pro',JSON.stringify(S))}catch(e){}};

const sel=$('#unit');
for(const u in UNITS){const o=document.createElement('option');o.value=u;o.textContent=UNITS[u].l;sel.appendChild(o);}
sel.value=S.unit;
sel.onchange=()=>{S.unit=sel.value;save();draw();};

function fmt(mm){
  if(S.unit==='ftin'){const i=Math.round(mm/25.4);return Math.floor(i/12)+"'-"+(i%12)+'"';}
  const v=mm/UNITS[S.unit].f;return (S.unit==='mm'?Math.round(v):Math.round(v*100)/100)+' '+S.unit;
}

const sx=x=>x*view.k+view.x,sy=y=>y*view.k+view.y;
const toW=(px,py)=>[(px-view.x)/view.k,(py-view.y)/view.k];

function snapPt(x,y,from){
  let bd=16/view.k,b=null;
  for(const w of S.walls)for(const p of [[w.x1,w.y1],[w.x2,w.y2]]){const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;b=p;}}
  if(b)return{x:b[0],y:b[1]};
  if(snap){const g=UNITS[S.unit].s;x=Math.round(x/g)*g;y=Math.round(y/g)*g;}
  if(ortho&&from){if(Math.abs(x-from.x)<Math.abs(y-from.y))x=from.x;else y=from.y;}
  return{x,y};
}

function distSeg(px,py,w){
  const dx=w.x2-w.x1,dy=w.y2-w.y1,l=dx*dx+dy*dy;let t=l?((px-w.x1)*dx+(py-w.y1)*dy)/l:0;
  t=Math.max(0,Math.min(1,t));return Math.hypot(px-(w.x1+t*dx),py-(w.y1+t*dy));
}

function push(){
  undo.push(JSON.stringify({walls:S.walls,doors:S.doors,windows:S.windows}));
  if(undo.length>100)undo.shift();
}

function eraseAt(x,y){
  let hit=false,bd=18/view.k,idx=-1;
  S.walls.forEach((w,j)=>{if(distSeg(x,y,w)<bd){bd=distSeg(x,y,w);idx=j;hit='wall';}});
  if(idx>=0&&hit==='wall'){push();S.walls.splice(idx,1);save();return;}
  S.doors.forEach((d,j)=>{if(Math.hypot(d.x-x,d.y-y)<25/view.k){push();S.doors.splice(j,1);save();hit=true;}});
  S.windows.forEach((w,j)=>{if(Math.hypot(w.x-x,w.y-y)<25/view.k){push();S.windows.splice(j,1);save();hit=true;}});
  if(hit)draw();
}

function label(w,col){
  const a=sx(w.x1),b=sy(w.y1),c=sx(w.x2),d=sy(w.y2),L=Math.hypot(c-a,d-b);
  if(L<45)return;
  const nx=-(d-b)/L,ny=(c-a)/L;let ang=Math.atan2(d-b,c-a);
  if(ang>Math.PI/2||ang<-Math.PI/2)ang+=Math.PI;
  ctx.save();ctx.translate((a+c)/2+nx*16,(b+d)/2+ny*16);ctx.rotate(ang);
  ctx.fillStyle=col;ctx.font='11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(fmt(Math.hypot(w.x2-w.x1,w.y2-w.y1)),0,0);ctx.restore();
}

function wall(w,col){
  ctx.strokeStyle=col;ctx.lineWidth=Math.max(T*view.k,3);ctx.lineCap='square';
  ctx.beginPath();ctx.moveTo(sx(w.x1),sy(w.y1));ctx.lineTo(sx(w.x2),sy(w.y2));ctx.stroke();
}

function draw(){
  if(is3D)return;
  const W=cv.clientWidth,H=cv.clientHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  
  if(S.bgImage){
    ctx.drawImage(S.bgImage,view.x,view.y,S.bgImage.width*view.k,S.bgImage.height*view.k);
  }

  let step=UNITS[S.unit].s;while(step*view.k<9)step*=2;
  const x0=-view.x/view.k,y0=-view.y/view.k,x1=(W-view.x)/view.k,y1=(H-view.y)/view.k;
  ctx.lineWidth=1;
  for(let x=Math.floor(x0/step)*step;x<=x1;x+=step){ctx.strokeStyle=Math.round(x/step)%5===0?'#33363c':'#1c1e21';ctx.beginPath();ctx.moveTo(sx(x),0);ctx.lineTo(sx(x),H);ctx.stroke();}
  for(let y=Math.floor(y0/step)*step;y<=y1;y+=step){ctx.strokeStyle=Math.round(y/step)%5===0?'#33363c':'#1c1e21';ctx.beginPath();ctx.moveTo(0,sy(y));ctx.lineTo(W,sy(y));ctx.stroke();}
  
  for(const w of S.walls){wall(w,'#f2f2f2');label(w,'#9aa0a6');}
  
  // Draw Doors
  for(const d of S.doors){
    ctx.fillStyle='#e0a526';ctx.beginPath();ctx.arc(sx(d.x),sy(d.y),8,0,Math.PI*2);ctx.fill();
  }
  // Draw Windows
  for(const w of S.windows){
    ctx.fillStyle='#3498db';ctx.fillRect(sx(w.x)-6,sy(w.y)-6,12,12);
  }

  let msg={pan:'Pan & Zoom mode.',wall:'Drag to draw 230mm wall.',door:'Tap wall to place Door.',window:'Tap wall to place Window.',erase:'Tap element to delete.'}[tool];
  if(drag&&drag.t==='wall'){
    const w={x1:drag.a.x,y1:drag.a.y,x2:drag.b.x,y2:drag.b.y};
    wall(w,'#e0a526');label(w,'#e0a526');msg='Wall length: '+fmt(Math.hypot(w.x2-w.x1,w.y2-w.y1));
  }
  $('#st').textContent=msg+'   |   Walls: '+S.walls.length+' | Doors: '+S.doors.length;
}

function resize(){dpr=window.devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;draw();}

// --- 3D BIM ENGINE (ArchiCAD / Revit Style) ---
function init3D(){
  if(!scene){
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0b0b0c);
    camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,100,50000);
    camera.position.set(0,-2000,3000);
    camera.lookAt(0,0,0);
    renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize($('#view3D').clientWidth,$('#view3D').clientHeight);
    $('#view3D').appendChild(renderer.domElement);

    const amb=new THREE.AmbientLight(0xffffff,0.7);scene.add(amb);
    const dir=new THREE.DirectionalLight(0xffffff,0.6);dir.position.set(1000,2000,3000);scene.add(dir);
  }

  // Clear old 3D meshes
  scene.children.forEach(c=>{if(c.isMesh||c.isGroup)scene.remove(c);});

  // Ground slab
  const planeGeo=new THREE.PlaneGeometry(10000,10000);
  const planeMat=new THREE.MeshStandardMaterial({color:0x1a1c23,roughness:0.9});
  const plane=new THREE.Mesh(planeGeo,planeMat);scene.add(plane);

  // Extrude Walls in 3D (BIM style)
  const wallHeight=3000; // 3m standard ceiling height
  S.walls.forEach(w=>{
    const dx=w.x2-w.x1,dy=w.y2-w.y1,len=Math.hypot(dx,dy);
    if(len<1)return;
    const geom=new THREE.BoxGeometry(len,T,wallHeight);
    const mat=new THREE.MeshStandardMaterial({color:0xf2f2f2,roughness:0.3});
    const mesh=new THREE.Mesh(geom,mat);
    
    mesh.position.set((w.x1+w.x2)/2,(w.y1+w.y2)/2,wallHeight/2);
    mesh.rotation.z=Math.atan2(dy,dx);
    scene.add(mesh);
  });

  // Auto Roof Generation option
  if(S.walls.length>2){
    const roofMat=new THREE.MeshStandardMaterial({color:0xe0a526,roughness:0.4});
    const roofGeom=new THREE.ConeGeometry(3000,1500,4);
    const roof=new THREE.Mesh(roofGeom,roofMat);
    roof.position.set(0,0,3750);
    roof.rotation.x=Math.PI/2;
    roof.rotation.y=Math.PI/4;
    scene.add(roof);
  }

  function animate(){
    if(!is3D)return;
    renderLoopId=requestAnimationFrame(animate);
    renderer.render(scene,camera);
  }
  animate();
}

$('#mode3D').onclick=()=>{
  is3D=!is3D;
  $('#mode3D').classList.toggle('on',is3D);
  if(is3D){
    $('#view3D').style.display='block';
    cv.style.display='none';
    init3D();
    $('#st').textContent='3D BIM Mode active. Orbit / Explore.';
  }else{
    cancelAnimationFrame(renderLoopId);
    $('#view3D').style.display='none';
    cv.style.display='block';
    draw();
  }
};

$('#roofBtn').onclick=()=>{
  alert('Auto-generated roof and elevations computed successfully from floor plan!');
};

// PDF & Image Importer
$('#pdfUpload').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  if(file.type==='application/pdf'){
    const reader=new FileReader();
    reader.readAsArrayBuffer(file);
    reader.onload=async function(){
      const pdf=await pdfjsLib.getDocument({data:this.result}).promise;
      const page=await pdf.getPage(1);
      const viewport=page.getViewport({scale:1.5});
      const canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
      const img=new Image();img.src=canvas.toDataURL();
      img.onload=()=>{S.bgImage=img;draw();};
    };
  }else{
    const reader=new FileReader();
    reader.readAsDataURL(file);
    reader.onload=()=>{
      const img=new Image();img.src=reader.result;
      img.onload=()=>{S.bgImage=img;draw();};
    };
  }
};

// Pointer and Drawing Event Handlers
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size>=2)return;
  const[wx,wy]=toW(e.offsetX,e.offsetY);
  if(tool==='wall'){const p=snapPt(wx,wy,null);drag={t:'wall',a:p,b:p};}
  else if(tool==='door'){push();S.doors.push({x:wx,y:wy});save();draw();}
  else if(tool==='window'){push();S.windows.push({x:wx,y:wy});save();draw();}
  else if(tool==='pan')drag={t:'pan',sx:e.offsetX,sy:e.offsetY,vx:view.x,vy:view.y};
  else eraseAt(wx,wy);
  draw();
});

cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(!drag)return;
  if(drag.t==='wall'){const[wx,wy]=toW(e.offsetX,e.offsetY);drag.b=snapPt(wx,wy,drag.a);}
  else{view.x=drag.vx+e.offsetX-drag.sx;view.y=drag.vy+e.offsetY-drag.sy;}
  draw();
});

function end(e){
  ptrs.delete(e.pointerId);
  if(drag&&drag.t==='wall'&&Math.hypot(drag.a.x-drag.b.x,drag.a.y-drag.b.y)>50){
    push();S.walls.push({x1:drag.a.x,y1:drag.a.y,x2:drag.b.x,y2:drag.b.y});save();
  }
  drag=null;draw();
}
cv.addEventListener('pointerup',end);
cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();const k=Math.min(2,Math.max(0.005,view.k*(e.deltaY<0?1.1:0.9))),wx=(e.offsetX-view.x)/view.k,wy=(e.offsetY-view.y)/view.k;view.k=k;view.x=e.offsetX-wx*k;view.y=e.offsetY-wy*k;draw();},{passive:false});

document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
  tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));draw();
});

$('#undo').onclick=()=>{if(undo.length){const p=JSON.parse(undo.pop());S.walls=p.walls;S.doors=p.doors;S.windows=p.windows;save();draw();}};
$('#ortho').onclick=e=>{ortho=!ortho;e.currentTarget.classList.toggle('on',ortho);};
$('#snap').onclick=e=>{snap=!snap;e.currentTarget.classList.toggle('on',snap);};
$('#clear').onclick=()=>{if(confirm('Clear entire project?')){push();S.walls=[];S.doors=[];S.windows=[];S.bgImage=null;save();draw();}};

window.addEventListener('resize',resize);
resize();
setTimeout(()=>{const s=$('#splash');s.style.opacity=0;setTimeout(()=>s.remove(),500);},1600);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
